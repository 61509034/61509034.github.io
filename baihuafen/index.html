.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;baihuafen-dictation&quot;&gt;
  &lt;style&gt;
    #baihuafen-dictation { color: var(--foreground); }
    #baihuafen-dictation .bh-head,
    #baihuafen-dictation .bh-session-row,
    #baihuafen-dictation .bh-question,
    #baihuafen-dictation .bh-actions,
    #baihuafen-dictation .bh-summary { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #baihuafen-dictation .bh-head { justify-content: space-between; margin-bottom: 14px; }
    #baihuafen-dictation .bh-head h2,
    #baihuafen-dictation .bh-head p { margin: 0; }
    #baihuafen-dictation .bh-session-row { margin-bottom: 14px; }
    #baihuafen-dictation .bh-session-row .btn { flex: 1 1 180px; }
    #baihuafen-dictation .bh-stage { padding: 20px; }
    #baihuafen-dictation .bh-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    #baihuafen-dictation .bh-question { justify-content: center; margin: 28px 0; }
    #baihuafen-dictation .bh-fraction { display: inline-grid; grid-template-rows: auto auto; text-align: center; min-width: 34px; }
    #baihuafen-dictation .bh-fraction span:first-child { border-bottom: 1px solid var(--foreground); }
    #baihuafen-dictation .bh-equals { font-weight: 500; }
    #baihuafen-dictation .bh-answer { width: min(180px, 55vw); }
    #baihuafen-dictation .bh-actions { justify-content: center; }
    #baihuafen-dictation .bh-feedback { min-height: 24px; text-align: center; margin: 14px 0 0; }
    #baihuafen-dictation .bh-progress { margin-top: 14px; }
    #baihuafen-dictation .bh-summary { justify-content: center; text-align: center; padding: 18px 0 4px; }
    #baihuafen-dictation .bh-summary strong { font-weight: 500; }
    #baihuafen-dictation details { margin-top: 16px; }
    #baihuafen-dictation summary { cursor: pointer; }
    #baihuafen-dictation .bh-table-wrap { margin-top: 10px; }
    #baihuafen-dictation .bh-hidden { display: none; }
    @media (max-width: 420px) {
      #baihuafen-dictation .bh-stage { padding: 14px; }
      #baihuafen-dictation .bh-question { margin: 22px 0; gap: 8px; }
      #baihuafen-dictation .bh-answer { width: 132px; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;bh-head&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;百化分默写&lt;/h2&gt;
      &lt;p class=&quot;text-small text-muted&quot; id=&quot;bh-date&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;bh-day-status&quot;&gt;今日 0/2&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;bh-session-row&quot; aria-label=&quot;选择默写场次&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;bh-morning&quot; aria-pressed=&quot;false&quot;&gt;早间 · 未完成&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;bh-evening&quot; aria-pressed=&quot;false&quot;&gt;晚间 · 未完成&lt;/button&gt;
  &lt;/div&gt;

  &lt;section class=&quot;card bh-stage&quot; aria-labelledby=&quot;bh-session-title&quot;&gt;
    &lt;div class=&quot;bh-meta&quot;&gt;
      &lt;strong id=&quot;bh-session-title&quot;&gt;早间默写&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot; id=&quot;bh-count&quot;&gt;第 1 / 10 题&lt;/span&gt;
    &lt;/div&gt;

    &lt;div id=&quot;bh-practice&quot;&gt;
      &lt;div class=&quot;bh-question&quot; aria-label=&quot;默写题目&quot;&gt;
        &lt;span class=&quot;bh-fraction&quot; aria-label=&quot;分数&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span id=&quot;bh-denominator&quot;&gt;2&lt;/span&gt;&lt;/span&gt;
        &lt;span class=&quot;bh-equals&quot;&gt;=&lt;/span&gt;
        &lt;label class=&quot;sr-only&quot; for=&quot;bh-input&quot;&gt;百分数答案&lt;/label&gt;
        &lt;input id=&quot;bh-input&quot; class=&quot;form-control bh-answer&quot; inputmode=&quot;decimal&quot; autocomplete=&quot;off&quot; placeholder=&quot;输入百分数&quot;&gt;
        &lt;span&gt;%&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;bh-actions&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;bh-check&quot;&gt;核对答案&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn bh-hidden&quot; id=&quot;bh-next&quot;&gt;下一题&lt;/button&gt;
      &lt;/div&gt;
      &lt;p class=&quot;bh-feedback text-small&quot; id=&quot;bh-feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;progress bh-progress&quot; role=&quot;progressbar&quot; aria-label=&quot;本场进度&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;10&quot; aria-valuenow=&quot;0&quot;&gt;
        &lt;div class=&quot;progress-bar&quot; id=&quot;bh-progress-bar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;bh-summary bh-hidden&quot; id=&quot;bh-summary&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div&gt;
        &lt;strong id=&quot;bh-score&quot;&gt;本场完成&lt;/strong&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;bh-score-detail&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;bh-retry&quot;&gt;重练错题&lt;/button&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;details&gt;
    &lt;summary&gt;复习表&lt;/summary&gt;
    &lt;div class=&quot;table-responsive bh-table-wrap&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;分数&lt;/th&gt;&lt;th&gt;百分数&lt;/th&gt;&lt;th&gt;分数&lt;/th&gt;&lt;th&gt;百分数&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody id=&quot;bh-review&quot;&gt;&lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;baihuafen-dictation&#x27;);
      const deck = [
        [1,&#x27;100&#x27;],[2,&#x27;50&#x27;],[3,&#x27;33.3&#x27;],[4,&#x27;25&#x27;],[5,&#x27;20&#x27;],[6,&#x27;16.7&#x27;],[7,&#x27;14.3&#x27;],[8,&#x27;12.5&#x27;],[9,&#x27;11.1&#x27;],[10,&#x27;10&#x27;],
        [11,&#x27;9.1&#x27;],[12,&#x27;8.3&#x27;],[13,&#x27;7.7&#x27;],[14,&#x27;7.1&#x27;],[15,&#x27;6.7&#x27;],[16,&#x27;6.25&#x27;],[17,&#x27;5.9&#x27;],[18,&#x27;5.6&#x27;],[19,&#x27;5.3&#x27;],[20,&#x27;5&#x27;]
      ];
      const $ = (s) =&gt; root.querySelector(s);
      const dateKey = new Intl.DateTimeFormat(&#x27;sv-SE&#x27;, {timeZone:&#x27;Asia/Shanghai&#x27;}).format(new Date());
      const displayDate = new Intl.DateTimeFormat(&#x27;zh-CN&#x27;, {timeZone:&#x27;Asia/Shanghai&#x27;, month:&#x27;long&#x27;, day:&#x27;numeric&#x27;, weekday:&#x27;short&#x27;}).format(new Date());
      const storageKey = &#x27;baihuafen-v2-&#x27; + dateKey;
      let saved;
      try { saved = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (_) { saved = {}; }
      saved.morning ||= {done:false, score:0, wrong:[]};
      saved.evening ||= {done:false, score:0, wrong:[]};
      let slot = new Date().getHours() &lt; 15 ? &#x27;morning&#x27; : &#x27;evening&#x27;;
      let questions = [];
      let index = 0;
      let score = 0;
      let wrong = [];
      let checked = false;
      let retrying = false;

      function hashSeed(text) {
        let h = 2166136261;
        for (let i = 0; i &lt; text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h &gt;&gt;&gt; 0;
      }
      function seeded(seed) {
        return () =&gt; { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed &gt;&gt;&gt; 15, 1 | seed); t = t + Math.imul(t ^ t &gt;&gt;&gt; 7, 61 | t) ^ t; return ((t ^ t &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296; };
      }
      function shuffled(items, salt) {
        const out = items.slice();
        const rand = seeded(hashSeed(dateKey + salt));
        for (let i = out.length - 1; i &gt; 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
        return out;
      }
      function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (_) {} }
      function normalize(value) { return value.trim().replace(/%|％/g,&#x27;&#x27;).replace(/。/g,&#x27;.&#x27;); }
      function isCorrect(input, answer) {
        const n = Number(normalize(input));
        const a = Number(answer);
        return Number.isFinite(n) &amp;&amp; Math.abs(n - a) &lt; 0.051;
      }
      function updateDayStatus() {
        const done = Number(saved.morning.done) + Number(saved.evening.done);
        $(&#x27;#bh-day-status&#x27;).textContent = &#x27;今日 &#x27; + done + &#x27;/2&#x27;;
        [&#x27;morning&#x27;,&#x27;evening&#x27;].forEach(name =&gt; {
          const btn = $(&#x27;#bh-&#x27; + name);
          const label = name === &#x27;morning&#x27; ? &#x27;早间&#x27; : &#x27;晚间&#x27;;
          btn.textContent = label + &#x27; · &#x27; + (saved[name].done ? (&#x27;已完成 &#x27; + saved[name].score + &#x27;/10&#x27;) : &#x27;未完成&#x27;);
          btn.setAttribute(&#x27;aria-pressed&#x27;, String(slot === name));
        });
      }
      function renderQuestion() {
        const q = questions[index];
        $(&#x27;#bh-denominator&#x27;).textContent = q[0];
        $(&#x27;#bh-count&#x27;).textContent = &#x27;第 &#x27; + (index + 1) + &#x27; / &#x27; + questions.length + &#x27; 题&#x27;;
        $(&#x27;#bh-input&#x27;).value = &#x27;&#x27;;
        $(&#x27;#bh-input&#x27;).disabled = false;
        $(&#x27;#bh-check&#x27;).classList.remove(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-next&#x27;).classList.add(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-feedback&#x27;).textContent = &#x27;&#x27;;
        $(&#x27;#bh-feedback&#x27;).className = &#x27;bh-feedback text-small&#x27;;
        checked = false;
        const complete = index;
        const pct = questions.length ? Math.round(complete / questions.length * 100) : 0;
        $(&#x27;.progress&#x27;).setAttribute(&#x27;aria-valuemax&#x27;, String(questions.length));
        $(&#x27;.progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, String(complete));
        $(&#x27;#bh-progress-bar&#x27;).style.width = pct + &#x27;%&#x27;;
        $(&#x27;#bh-input&#x27;).focus();
      }
      function start(name, retryWrong) {
        slot = name;
        retrying = Boolean(retryWrong);
        const daily = shuffled(deck, &#x27;-daily&#x27;);
        const sessionDeck = slot === &#x27;morning&#x27; ? daily.slice(0, 10) : daily.slice(10, 20);
        const base = retrying &amp;&amp; saved[slot].wrong.length ? deck.filter(q =&gt; saved[slot].wrong.includes(q[0])) : sessionDeck;
        questions = retrying ? shuffled(base, slot + &#x27;-retry&#x27;) : base;
        index = 0; score = 0; wrong = [];
        $(&#x27;#bh-session-title&#x27;).textContent = (slot === &#x27;morning&#x27; ? &#x27;早间&#x27; : &#x27;晚间&#x27;) + (retryWrong ? &#x27;错题重练&#x27; : &#x27;默写&#x27;);
        $(&#x27;#bh-practice&#x27;).classList.remove(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-summary&#x27;).classList.add(&#x27;bh-hidden&#x27;);
        updateDayStatus();
        renderQuestion();
      }
      function check() {
        if (checked) return;
        const input = $(&#x27;#bh-input&#x27;).value;
        if (!normalize(input)) {
          $(&#x27;#bh-feedback&#x27;).textContent = &#x27;先写下答案再核对&#x27;;
          $(&#x27;#bh-feedback&#x27;).className = &#x27;bh-feedback text-small text-destructive&#x27;;
          return;
        }
        checked = true;
        const q = questions[index];
        const ok = isCorrect(input, q[1]);
        if (ok) {
          score++;
          $(&#x27;#bh-feedback&#x27;).textContent = &#x27;正确&#x27;;
        } else {
          wrong.push(q[0]);
          $(&#x27;#bh-feedback&#x27;).textContent = &#x27;答案：&#x27; + q[1] + &#x27;%&#x27;;
          $(&#x27;#bh-feedback&#x27;).className = &#x27;bh-feedback text-small text-destructive&#x27;;
        }
        $(&#x27;#bh-input&#x27;).disabled = true;
        $(&#x27;#bh-check&#x27;).classList.add(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-next&#x27;).classList.remove(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-next&#x27;).textContent = index === questions.length - 1 ? &#x27;完成本场&#x27; : &#x27;下一题&#x27;;
      }
      function next() {
        if (!checked) return;
        if (index &lt; questions.length - 1) { index++; renderQuestion(); return; }
        if (!retrying) {
          saved[slot] = {done:true, score, wrong:Array.from(new Set(wrong))};
          persist();
        }
        $(&#x27;#bh-practice&#x27;).classList.add(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-summary&#x27;).classList.remove(&#x27;bh-hidden&#x27;);
        $(&#x27;#bh-score&#x27;).textContent = !retrying ? (&#x27;本场 &#x27; + score + &#x27;/10&#x27;) : (&#x27;错题重练 &#x27; + score + &#x27;/&#x27; + questions.length);
        $(&#x27;#bh-score-detail&#x27;).textContent = wrong.length ? (&#x27;还需巩固：&#x27; + wrong.map(n =&gt; &#x27;1/&#x27; + n).join(&#x27;、&#x27;)) : &#x27;全部正确&#x27;;
        $(&#x27;#bh-retry&#x27;).classList.toggle(&#x27;bh-hidden&#x27;, wrong.length === 0 &amp;&amp; saved[slot].wrong.length === 0);
        updateDayStatus();
      }

      $(&#x27;#bh-date&#x27;).textContent = displayDate + &#x27; · 早晚各 10 题&#x27;;
      $(&#x27;#bh-morning&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; start(&#x27;morning&#x27;, false));
      $(&#x27;#bh-evening&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; start(&#x27;evening&#x27;, false));
      $(&#x27;#bh-check&#x27;).addEventListener(&#x27;click&#x27;, check);
      $(&#x27;#bh-next&#x27;).addEventListener(&#x27;click&#x27;, next);
      $(&#x27;#bh-input&#x27;).addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Enter&#x27;) { event.preventDefault(); checked ? next() : check(); }
      });
      $(&#x27;#bh-retry&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; start(slot, true));

      const rows = [];
      for (let i = 0; i &lt; deck.length; i += 2) {
        const a = deck[i], b = deck[i + 1];
        rows.push(&#x27;&lt;tr&gt;&lt;td&gt;1/&#x27; + a[0] + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + a[1] + &#x27;%&lt;/td&gt;&#x27; + (b ? &#x27;&lt;td&gt;1/&#x27; + b[0] + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + b[1] + &#x27;%&lt;/td&gt;&#x27; : &#x27;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&#x27;) + &#x27;&lt;/tr&gt;&#x27;);
      }
      $(&#x27;#bh-review&#x27;).innerHTML = rows.join(&#x27;&#x27;);
      start(slot, false);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
